# .github/workflows/update-berlin-analytics.yml
name: Update Berlin Analytics Data

on:
  schedule:
    # Run every Monday at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install requirements
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scripts/berlin-scraper.py

      - name: Commit and push
        run: |
          git config --global user.name 'Berlin Analytics Bot'
          git config --global user.email 'analyticsbot@users.noreply.github.com'
          git add data/berlin-analytics-data.json
          git commit -m "Auto-update Berlin analytics data"
          git push
